databaseChangeLog:
  - changeSet:
      id: 1-create-time-capsule-table
      author: timecapsule-project
      changes:
        - createTable:
            tableName: time_capsule
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: time_capsule_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: opening_date
                  type: DATE
                  constraints:
                    nullable: false
  - changeSet:
      id: 2-create-index-opening-date
      author: timecapsule-project
      changes:
        - createIndex:
            indexName: idx_time_capsule_opening_date
            tableName: time_capsule
            columns:
              - column:
                  name: opening_date

  - changeSet:
      id: 3-create-user-time-capsule-table
      author: timecapsule-project
      changes:
        - createTable:
            tableName: user_time_capsule
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_time_capsule
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_time_capsule_time_capsule
                    references: time_capsule(id)
              - column:
                  name: user_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 4-create-index-user-time-capsule-foreign-key
      author: timecapsule-project
      changes:
        - createIndex:
            indexName: idx_user_time_capsule_id_time_capsule
            tableName: user_time_capsule
            columns:
              - column:
                  name: id_time_capsule

  - changeSet:
      id: 5-create-index-user-time-capsule-email
      author: timecapsule-project
      changes:
        - createIndex:
            indexName: idx_user_time_capsule_user_email
            tableName: user_time_capsule
            columns:
              - column:
                  name: user_email

  - changeSet:
      id: 6-create-retry-capsule-table
      author: timecapsule-project
      changes:
        - createTable:
            tableName: retry_capsule
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: capsule_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_retry_capsule_attempts
            tableName: retry_capsule
            columns:
              - column:
                  name: attempts

  - changeSet:
      id: 7-add-retry-attempts-to-time-capsule
      author: timecapsule-project
      changes:
        - addColumn:
            tableName: time_capsule
            columns:
              - column:
                  name: retry_attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_time_capsule_retry_attempts
            tableName: time_capsule
            columns:
              - column:
                  name: retry_attempts
